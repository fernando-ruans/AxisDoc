name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    strategy:
      matrix:
        include:
          - os: windows-latest
            extra: '-nsis'
          - os: ubuntu-latest
            extra: ''
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar deps do Linux (WebKitGTK)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Testes antes de publicar
        run: |
          go test ./internal/... -count=1
          cd frontend && npm ci && npm test

      - name: Instalar NSIS (Windows)
        if: runner.os == 'Windows'
        run: choco install nsis -y --no-progress

      - name: Build + instalador
        run: wails build ${{ matrix.extra }}

      - name: Empacotar Linux (tar.gz)
        if: runner.os == 'Linux'
        run: |
          cd build/bin
          tar -czf axisdoc-linux-amd64.tar.gz axisdoc
          cd ../..

      - name: Publicar no GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/bin/axisdoc.exe
            build/bin/AxisDoc-amd64-installer.exe
            build/bin/*.zip
            build/bin/axisdoc-linux-amd64.tar.gz
