name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar deps do Linux (WebKitGTK)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Vet + testes Go com cobertura
        run: |
          go vet ./...
          go test ./internal/... -count=1 -covermode=atomic -coverprofile=${{ github.workspace }}/coverage.out
          go run ./scripts/coverage-gate ${{ github.workspace }}/coverage.out 70

      - name: Testes frontend
        working-directory: frontend
        run: |
          npm ci
          npm test

      - name: Testes E2E
        working-directory: frontend
        run: |
          npx playwright install chromium --with-deps
          npm run e2e

      - name: Build do app
        run: wails build

